# ========== 本地 DEV 全栈(自包含,部署源外置版) ==========
# 所有 build context 指向 apps/ 下的项目目录,项目本体零修改、零文件放入。
# 等价于原 core_app/docker-compose.yml + deploy/docker-compose.dev.yml 的合并结果:
# 容器名(css-backend__*)、卷名、项目名(COMPOSE_PROJECT_NAME=css-backend)与原方案一致,
# 原有 css-backend_db_volume 等卷及其中数据自动沿用,无需迁移。
#
# 用法(在 部署包 根目录执行,或直接用 bin\本地dev.ps1):
#   docker compose --project-directory . --env-file env/dev/backend.env -f compose/dev.yml up -d
# 前端容器(可选,无 HMR;VITE_* 来自 env/dev/frontend.env): 追加 --profile frontend
# 2FA 看码: http://localhost:8085 (kafka-ui) -> Topics -> sms_send

x-logging: &logging
  driver: json-file

x-env-file: &env-file
  env_file:
    - env/dev/backend.env

services:
  db:
    container_name: css-backend__db
    build: ./apps/CSS_backend-main/core_app/postgres
    image: ${IMAGE_DB}
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    <<: *env-file

  app:
    container_name: css-backend__app
    build:
      context: ./apps/CSS_backend-main/core_app
      dockerfile: ./src/Dockerfile
    image: ${IMAGE_APP}
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    restart: always
    depends_on:
      worker:
        condition: service_started
      db:
        condition: service_healthy
    command: >
      gunicorn
        --workers ${APP_WORKERS_NUMBER}
        --worker-class uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:${APP_INTERNAL_PORT}
        app.internal.main:app
    logging: *logging
    <<: *env-file

  messenger-app:
    container_name: css-backend__messenger-app
    build:
      context: ./apps/CSS_backend-main/core_app
      dockerfile: ./src/Dockerfile
    image: ${IMAGE_APP}
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    restart: always
    depends_on:
      db:
        condition: service_healthy
    command: >
      gunicorn
        --workers ${MESSENGER_APP_WORKERS_NUMBER}
        --worker-class uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:${MESSENGER_APP_INTERNAL_PORT}
        app.internal.messenger_app:app
    logging: *logging
    <<: *env-file

  notifications-app:
    container_name: css-backend__notifications-app
    build:
      context: ./apps/CSS_backend-main/core_app
      dockerfile: ./src/Dockerfile
    image: ${IMAGE_APP}
    ports:
      - "${NOTIFICATIONS_APP_INTERNAL_PORT}:${NOTIFICATIONS_APP_INTERNAL_PORT}"
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      gunicorn
        --workers ${NOTIFICATIONS_APP_WORKERS_NUMBER}
        --worker-class uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:${NOTIFICATIONS_APP_INTERNAL_PORT}
        app.internal.notifications_app:app
    logging: *logging
    <<: *env-file

  worker:
    container_name: css-backend__worker
    build:
      context: ./apps/CSS_backend-main/core_app
      dockerfile: ./src/Dockerfile
    image: ${IMAGE_APP}
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.internal.worker.app.Worker
    healthcheck:
      test: ["CMD", "arq", "app.internal.worker.app.Worker", "--check"]
      interval: 1m
      timeout: 30s
      retries: 10
      start_period: 30s
    logging: *logging
    <<: *env-file

  nginx:
    container_name: css-backend__nginx
    build: ./apps/CSS_backend-main/core_app/nginx
    image: ${IMAGE_NGINX}
    restart: always
    ports:
      - "${PORT}:80"
    depends_on:
      - app
    volumes:
      - nginx_log_volume:/var/log/nginx
    environment:
      - APP_INTERNAL_PORT=${APP_INTERNAL_PORT}
      - MESSENGER_APP_INTERNAL_PORT=${MESSENGER_APP_INTERNAL_PORT}
      - NOTIFICATIONS_APP_INTERNAL_PORT=${NOTIFICATIONS_APP_INTERNAL_PORT}
    logging: *logging

  redis:
    container_name: css-backend__redis
    image: redis:7.2.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    volumes:
      - redis_volume:/data
    logging: *logging

  rabbitmq:
    container_name: css-backend__rabbitmq
    hostname: rabbitmq
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    logging: *logging

  # ---------- Kafka(登录硬依赖:auth DI 每次请求连 kafka:9092) ----------
  kafka:
    container_name: css-backend__kafka
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    logging: *logging

  kafka-ui:
    container_name: css-backend__kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=css
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
      - AUTH_TYPE=DISABLED
    logging: *logging

  sms_sender:
    container_name: css-backend__sms-sender
    build:
      context: ./apps/CSS_backend-main
      dockerfile: ./sms_sender/Dockerfile
    image: ${IMAGE_SMS_SENDER}
    restart: unless-stopped
    depends_on:
      - kafka
    logging: *logging
    <<: *env-file

  email_sender:
    container_name: css-backend__email-sender
    build:
      context: ./apps/CSS_backend-main
      dockerfile: ./email_sender/Dockerfile
    image: ${IMAGE_EMAIL_SENDER}
    restart: unless-stopped
    depends_on:
      - kafka
    logging: *logging
    <<: *env-file

  pgadmin:
    container_name: css-backend__pgadmin
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    logging: *logging
    <<: *env-file

  # ---------- 前端容器(可选 profile;零项目修改,VITE_* 从部署包烤入;无 HMR) ----------
  # 需要 HMR 热更新做前端开发时,见 README-手册.md「前端本地开发」一节。
  frontend:
    profiles: ["frontend"]
    container_name: css-backend__frontend
    image: css-frontend_app_dev
    build:
      context: ./apps/CSS_frontend-main
      additional_contexts:
        envcfg: ./env/dev
        cfg: ./config
      # 与原 Dockerfile.novalidate 等价,但 env 与 nginx 配置来自部署包而非项目内文件。
      # 跳过 tsc(源码存在既有 TS 类型错误);修复后可把 npx vite build 改回 npm run build。
      dockerfile_inline: |
        FROM node:21-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm install --legacy-peer-deps && npm cache clean --force
        COPY . .
        COPY --from=envcfg frontend.env .env
        RUN npx vite build && ls dist/
        FROM nginx:alpine
        COPY --from=build /app/dist /usr/share/nginx/html
        COPY --from=cfg frontend-nginx.conf /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - nginx
    logging: *logging

volumes:
  db_volume:
  nginx_log_volume:
  redis_volume:
  rabbitmq_volume:
