# ========== AWS 支撑服务栈(infra):kafka / kafka-ui / redis / rabbitmq / ocr-redis ==========
# 三栈拆分之一(infra / backend / frontend),各自是独立 compose 项目,可单独部署互不影响。
# 跨栈互访靠共享 external 网络 css-${DEPLOY_ENV}-net(bin/deploy.sh 会自动创建),
# compose 会把服务名注册为网络别名,所以 backend 里仍然用 kafka/redis/rabbitmq 直接连。
# 本栈无 build、无项目文件依赖 —— EC2 上仅需本文件 + env/<env>/backend.env。
#
# 用法(走脚本): ./bin/deploy.sh <env> deploy infra
# 部署顺序建议:infra -> backend -> frontend(backend 起太早会重启重试,不致命)。
# 数据说明:kafka 数据不落盘(短信/邮件队列是瞬态的);redis / rabbitmq 有卷。

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  redis:
    image: redis:7.2.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    volumes:
      - redis_volume:/data
    logging: *logging

  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?缺 RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?缺 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    logging: *logging

  kafka:
    image: apache/kafka:3.7.0
    restart: always
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    logging: *logging

  # 2FA 看码工具:Topics -> sms_send。仅 tools profile(test/uat 脚本默认启用,prod 需 TOOLS=1)。
  kafka-ui:
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=css-${DEPLOY_ENV:-aws}
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
      - AUTH_TYPE=DISABLED
    logging: *logging

  ocr-redis:
    image: redis:7.2.1-alpine
    restart: unless-stopped
    volumes:
      - ocr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  redis_volume:
  rabbitmq_volume:
  ocr_redis_data:

networks:
  default:
    name: css-${DEPLOY_ENV:?缺 DEPLOY_ENV}-net
    external: true
